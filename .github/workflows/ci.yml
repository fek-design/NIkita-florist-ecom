name: CI

on:
  pull_request:
    branches: [DevEnv, main]
  # Every push gets feedback early; pull requests are what gate merges.
  push:
    branches: ["**"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Lint, types, tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Integration tests need a real Postgres, as locally in Docker.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: florist
          POSTGRES_PASSWORD: florist
          POSTGRES_DB: florist
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U florist"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://florist:florist@localhost:5432/florist_test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Fails on known high or critical vulnerabilities in production dependencies.
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
